<style>
/* ============ BASE ============ */
:root{
  --bg:#05060a; --bg2:#0a0d14; --panel:#0e121b; --panel2:#111726;
  --line:rgba(255,255,255,.08); --text:#eef2f7; --muted:#9aa3b2;
  --cyan:#22d3ee; --violet:#e8edf5; --green:#25d366;
  --grad:linear-gradient(92deg,var(--cyan),var(--violet));
  --font-h:'Space Grotesk',sans-serif; --font-b:'Inter',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--font-b);overflow-x:hidden;line-height:1.65}
body.has-cursor, body.has-cursor a, body.has-cursor button{cursor:none}
::selection{background:#e8edf5;color:#05060a}
::-webkit-scrollbar{width:9px}::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:linear-gradient(var(--cyan),var(--violet));border-radius:9px}
img{max-width:100%;display:block}
a{text-decoration:none;color:inherit}
button{font-family:var(--font-b)}
h1,h2,h3,h4{font-family:var(--font-h);line-height:1.15}
section{padding:110px 0;scroll-margin-top:90px;position:relative}
.container{width:min(1200px,92%);margin:0 auto}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.35em;text-transform:uppercase;color:var(--cyan);font-weight:600}
.eyebrow::before{content:"";width:34px;height:1px;background:var(--grad)}
.sec-title{font-size:clamp(2rem,4.6vw,3.3rem);font-weight:700;margin:14px 0 18px}
.sec-sub{color:var(--muted);max-width:640px;font-size:1.05rem}
.grid-bg{background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:56px 56px}

/* ============ REVEAL ============ */
.rv{transition:opacity .9s ease var(--d,0s),transform .9s cubic-bezier(.16,1,.3,1) var(--d,0s)}
.rv-up{opacity:0;transform:translateY(34px)}
.rv-left{opacity:0;transform:translateX(-46px)}
.rv-right{opacity:0;transform:translateX(46px)}
.rv-zoom{opacity:0;transform:scale(.88)}
.rv-line{opacity:1;transform:scaleX(0);transform-origin:left;transition:transform 1.5s cubic-bezier(.16,1,.3,1) .2s}
.rv.in{opacity:1;transform:none}

/* ============ CURSOR / PROGRESO ============ */
.cursor-dot,.cursor-ring{position:fixed;left:0;top:0;pointer-events:none;z-index:9999;border-radius:50%;display:none}
@media (pointer:fine){.cursor-dot,.cursor-ring{display:block}}
.cursor-dot{width:7px;height:7px;background:var(--cyan);margin:-3px 0 0 -3px}
.cursor-ring{width:38px;height:38px;margin:-19px 0 0 -19px;border:1.5px solid rgba(34,211,238,.55);transition:border-color .3s,background .3s,width .3s,height .3s,margin .3s}
body.cursor-hover .cursor-ring{border-color:var(--violet);background:rgba(232,237,245,.12);width:56px;height:56px;margin:-28px 0 0 -28px}
.scroll-progress{position:fixed;top:0;left:0;height:3px;background:var(--grad);z-index:1200;width:0}

/* ============ PRELOADER ============ */
.preloader{position:fixed;inset:0;background:var(--bg);z-index:2000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .7s,visibility .7s}
.preloader.done{opacity:0;visibility:hidden}
.pre-logo{display:flex;align-items:center;gap:32px;font-family:var(--font-h)}
.pre-text{font-size:20px;letter-spacing:.28em;border-right:3px solid #fff;padding-right:14px;line-height:1.3;animation:fadeUp .8s .3s both}
.pre-mark{font-size:44px;font-weight:700;border-right:3px solid #fff;border-bottom:3px solid #fff;padding:4px 14px;animation:markIn 1s cubic-bezier(.16,1,.3,1) both}
.pre-bar{width:220px;height:2px;background:rgba(255,255,255,.12);overflow:hidden;border-radius:2px}
.pre-bar i{display:block;height:100%;background:var(--grad);animation:load 1.4s ease forwards}
@keyframes markIn{from{opacity:0;transform:translateY(26px) scale(.8)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes load{from{width:0}to{width:100%}}

/* ============ NAVBAR ============ */
.navbar{position:fixed;top:0;left:0;right:0;z-index:1000;transition:background .4s,border-color .4s,backdrop-filter .4s;border-bottom:1px solid transparent}
.navbar.scrolled{background:rgba(5,6,10,.75);backdrop-filter:blur(16px);border-color:var(--line)}
.nav-inner{display:flex;align-items:center;justify-content:space-between;padding:18px 0}
.logo{display:flex;align-items:center;gap:16px;font-family:var(--font-h)}
.logo-text{font-size:15px;letter-spacing:.22em;border-right:2.5px solid #fff;padding-right:12px;line-height:1.25;font-weight:600;transition:.35s}
.logo-mark{font-size:26px;font-weight:700;border-right:2.5px solid #fff;border-bottom:2.5px solid #fff;padding:2px 10px;transition:.35s}
.logo:hover .logo-mark{border-color:var(--cyan);color:var(--cyan);transform:translateY(-2px)}
.logo:hover .logo-text{border-color:var(--cyan)}
.nav-links{display:flex;gap:30px;list-style:none}
.nav-links a{font-size:.92rem;font-weight:500;color:var(--muted);position:relative;transition:color .3s;cursor:pointer}
.nav-links a::after{content:"";position:absolute;left:0;bottom:-6px;width:0;height:2px;background:var(--grad);transition:width .35s}
.nav-links a:hover,.nav-links a.active{color:#fff}
.nav-links a:hover::after,.nav-links a.active::after{width:100%}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 30px;border-radius:999px;font-weight:600;font-family:var(--font-b);font-size:.95rem;border:none;transition:transform .3s,box-shadow .3s;position:relative;overflow:hidden;cursor:pointer}
.btn-primary{background:var(--grad);color:#04060b;box-shadow:0 10px 30px rgba(34,211,238,.25)}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 16px 40px rgba(232,237,245,.4)}
.btn-ghost{border:1px solid var(--line);color:var(--text);background:transparent}
.btn-ghost:hover{border-color:var(--cyan);color:var(--cyan);transform:translateY(-3px)}
.btn-sm{padding:11px 22px;font-size:.88rem}
.burger{display:none;flex-direction:column;gap:6px;background:none;border:none;z-index:1102}
.burger span{width:26px;height:2px;background:#fff;transition:.4s}
.burger.open span:nth-child(1){transform:translateY(8px) rotate(45deg)}
.burger.open span:nth-child(2){opacity:0}
.burger.open span:nth-child(3){transform:translateY(-8px) rotate(-45deg)}
.mobile-menu{position:fixed;inset:0;background:rgba(5,6,10,.97);backdrop-filter:blur(20px);z-index:1100;display:flex;flex-direction:column;justify-content:center;padding:0 8%;gap:8px;transform:translateY(-100%);transition:transform .6s cubic-bezier(.16,1,.3,1)}
.mobile-menu.open{transform:none}
.mobile-menu a{font-family:var(--font-h);font-size:2rem;font-weight:700;color:var(--muted);transition:.3s;opacity:0;transform:translateY(20px);cursor:pointer}
.mobile-menu.open a{opacity:1;transform:none}
.mobile-menu a:hover{color:var(--cyan)}

/* ============ HERO ============ */
.hero{min-height:100vh;display:flex;align-items:center;padding:150px 0 60px;overflow:hidden}
.hero-canvas{position:absolute;inset:0;z-index:0}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.35;z-index:0;animation:orbFloat 11s ease-in-out infinite}
.orb-1{width:480px;height:480px;background:var(--violet);top:-140px;right:-120px}
.orb-2{width:420px;height:420px;background:var(--cyan);bottom:-160px;left:-140px;animation-delay:-5s}
@keyframes orbFloat{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-30px)}}
.hero-grid{display:grid;grid-template-columns:1.08fr .92fr;gap:60px;align-items:center;position:relative;z-index:2}
.hero-badge{display:inline-flex;align-items:center;gap:10px;padding:9px 18px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.04);font-size:.82rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);backdrop-filter:blur(8px)}
.hero-badge i{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(37,211,102,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 11px rgba(37,211,102,0)}100%{box-shadow:0 0 0 0 rgba(37,211,102,0)}}
.hero h1{font-size:clamp(2.6rem,6vw,4.6rem);font-weight:700;margin:26px 0 10px;letter-spacing:-.02em}
.hero-type{font-family:var(--font-h);font-size:clamp(1.05rem,2.2vw,1.45rem);color:var(--muted);min-height:2.2em}
.hero-type b{color:var(--cyan);font-weight:600}
.caret{display:inline-block;width:2px;height:1.1em;background:var(--cyan);vertical-align:-3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.hero p.lead{color:var(--muted);max-width:540px;margin:18px 0 34px;font-size:1.06rem}
.hero-ctas{display:flex;gap:16px;flex-wrap:wrap}
.hero-stats{display:flex;gap:44px;margin-top:56px;flex-wrap:wrap}
.stat h3{font-size:2rem;font-weight:700}
.stat span{color:var(--muted);font-size:.86rem;letter-spacing:.06em;text-transform:uppercase}
.hero-visual{position:relative;height:520px}
.ring{position:absolute;inset:60px 40px;border-radius:50%;background:conic-gradient(from 0deg,var(--cyan),transparent 40%,var(--violet) 60%,transparent 90%,var(--cyan));animation:spin 9s linear infinite;filter:blur(2px);opacity:.5;-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px))}
@keyframes spin{to{transform:rotate(360deg)}}
.float-card{position:absolute;background:rgba(14,18,27,.8);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px;padding:18px 22px;box-shadow:0 24px 60px rgba(0,0,0,.5);animation:floatY 6s ease-in-out infinite}
.fc-1{top:60px;left:8%;animation-delay:0s}
.fc-2{top:210px;right:2%;animation-delay:-2s}
.fc-3{bottom:40px;left:16%;animation-delay:-4s}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
.float-card small{color:var(--muted);font-size:.75rem;letter-spacing:.1em;text-transform:uppercase}
.float-card h4{font-size:1.5rem;margin-top:4px}
.fc-bar{width:150px;height:5px;background:rgba(255,255,255,.1);border-radius:5px;margin-top:10px;overflow:hidden}
.fc-bar i{display:block;height:100%;width:78%;background:var(--grad);border-radius:5px;animation:barGrow 2.4s cubic-bezier(.16,1,.3,1) both .6s}
@keyframes barGrow{from{width:0}}
.scroll-hint{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);z-index:2;color:var(--muted);font-size:.75rem;letter-spacing:.3em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:10px}
.mouse{width:24px;height:38px;border:2px solid rgba(255,255,255,.25);border-radius:14px;position:relative}
.mouse::after{content:"";position:absolute;top:7px;left:50%;width:3px;height:7px;background:var(--cyan);border-radius:3px;transform:translateX(-50%);animation:wheel 1.6s ease infinite}
@keyframes wheel{to{transform:translate(-50%,12px);opacity:0}}

/* ============ MARQUEE ============ */
.marquee{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:22px 0;overflow:hidden;background:rgba(255,255,255,.02)}
.mq-track{display:flex;gap:56px;width:max-content;animation:mq 26s linear infinite}
.marquee:hover .mq-track{animation-play-state:paused}
.mq-item{display:flex;align-items:center;gap:56px;font-family:var(--font-h);font-size:1.05rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.mq-item em{font-style:normal;color:var(--cyan)}
@keyframes mq{to{transform:translateX(-50%)}}

/* ============ SERVICIOS (FLIP CARDS 3D) ============ */
.services-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;margin-top:60px}
.svc-card{background:var(--panel);border:1px solid var(--line);border-radius:20px;position:relative;overflow:hidden;transition:border-color .4s,box-shadow .4s;will-change:transform;perspective:1400px}
.svc-card:hover{border-color:rgba(34,211,238,.45);box-shadow:0 24px 60px rgba(0,0,0,.45)}
.svc-flip{position:relative;height:452px;transform-style:preserve-3d;transition:transform .85s cubic-bezier(.2,.85,.3,1)}
.svc-card:hover .svc-flip,.svc-card.flipped .svc-flip,.svc-card:focus-within .svc-flip{transform:rotateY(180deg)}
.svc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;overflow:hidden}
/* FIX: la cara oculta no debe capturar clics */
.svc-front{pointer-events:auto}
.svc-back{pointer-events:none}
.svc-card:hover .svc-front,
.svc-card.flipped .svc-front,
.svc-card:focus-within .svc-front{pointer-events:none}
.svc-card:hover .svc-back,
.svc-card.flipped .svc-back,
.svc-card:focus-within .svc-back{pointer-events:auto}
.svc-num{position:absolute;top:20px;right:22px;font-family:var(--font-h);font-size:.85rem;color:rgba(255,255,255,.55);letter-spacing:.15em;z-index:4}
/* Frente */
.svc-front{cursor:pointer}
.svc-front>img{width:100%;height:100%;object-fit:cover;transition:transform 1.1s cubic-bezier(.16,1,.3,1)}
.svc-card:hover .svc-front>img{transform:scale(1.07)}
.svc-front::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,6,10,.12),transparent 40%,rgba(5,6,10,.94) 100%);z-index:1}
.svc-front::after{content:"";position:absolute;top:0;left:-80%;width:55%;height:100%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.16),transparent);transform:skewX(-18deg);transition:left 1s ease;z-index:2}
.svc-card:hover .svc-front::after{left:135%}
.svc-chip{position:absolute;top:20px;left:22px;z-index:3;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:rgba(5,6,10,.55);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.16);color:var(--cyan)}
.svc-front-body{position:absolute;left:0;right:0;bottom:0;padding:24px;z-index:3}
.svc-front-body h3{font-size:1.35rem;color:#fff;letter-spacing:-.01em}
.svc-flip-hint{display:inline-flex;align-items:center;gap:8px;color:var(--cyan);font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;margin-top:10px;font-weight:600}
/* Atrás */
.svc-back{transform:rotateY(180deg);background:var(--panel2);padding:32px 28px;display:flex;flex-direction:column}
.svc-back::before{content:"";position:absolute;inset:0;background:radial-gradient(420px 200px at 20% 0%,rgba(34,211,238,.12),transparent 60%)}
.svc-icon{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;background:rgba(34,211,238,.1);border:1px solid rgba(34,211,238,.3);color:var(--cyan);margin-bottom:18px;transition:.4s;position:relative}
.svc-card:nth-child(even) .svc-icon{background:rgba(232,237,245,.12);border-color:rgba(232,237,245,.35);color:var(--violet)}
.svc-card:hover .svc-icon{transform:rotate(-8deg) scale(1.08)}
.svc-back h3{font-size:1.2rem;margin-bottom:10px;position:relative}
.svc-back p{color:var(--muted);font-size:.9rem;margin-bottom:16px;position:relative}
.svc-tags{display:flex;flex-wrap:wrap;gap:8px;position:relative}

.chart-row{display:flex;gap:30px;align-items:center;flex-wrap:wrap}
.donut{position:relative;width:150px;height:150px;flex:none}

.sp-cta-box p{color:var(--muted);margin-top:8px;max-width:520px}

/* ============ NOSOTROS ============ */

.about-quote{border-left:3px solid;border-image:var(--grad) 1;padding:6px 0 6px 24px;margin:30px 0;font-family:var(--font-h);font-size:1.25rem;color:var(--text)}

.check-list{list-style:none;margin-top:26px;display:grid;gap:14px}

.about-card::after{content:"JC";position:absolute;right:-20px;bottom:-58px;font-family:var(--font-h);font-size:11rem;font-weight:700;color:rgba(255,255,255,.04);line-height:1}
.value-row{display:flex;gap:18px;padding:20px 0;border-bottom:1px solid var(--line)}

.value-row .v-ic{width:46px;height:46px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--grad);color:#04060b}

/* ============ PROCESO ============ */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:30px;margin-top:70px;position:relative}
.steps-line{position:absolute;top:27px;left:4%;right:4%;height:2px;background:var(--grad)}

.step:hover .step-dot{background:var(--grad);color:#04060b;border-color:transparent;transform:scale(1.1) rotate(6deg);box-shadow:0 0 40px rgba(34,211,238,.4)}
.step h3{font-size:1.15rem;margin-bottom:10px}
.step p{color:var(--muted);font-size:.92rem}

/* ============ PROYECTOS ============ */
.proj-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;margin-top:60px}
.proj-card{border-radius:20px;overflow:hidden;background:var(--panel);border:1px solid var(--line);transition:transform .4s,border-color .4s}

.shot::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(5,6,10,.88))}
.proj-loc{position:absolute;left:16px;bottom:14px;z-index:2;display:flex;align-items:center;gap:7px;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:#fff}
.proj-loc svg{color:var(--cyan)}
.proj-info{padding:24px 26px}
.proj-cat{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--cyan)}
.proj-info h3{font-size:1.15rem;margin:8px 0 6px}
.proj-res{color:var(--muted);font-size:.88rem}

/* ============ TESTIMONIOS ============ */
.testi-wrap{max-width:820px;margin:60px auto 0;text-align:center;position:relative}
.testi-card{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:56px 60px;position:relative;overflow:hidden}

.testi-author b{color:var(--text);display:block;font-size:1rem}
.testi-anim{animation:testiIn .6s cubic-bezier(.16,1,.3,1)}
@keyframes testiIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.testi-dots{display:flex;gap:10px;justify-content:center;margin-top:28px}
.testi-dots button{width:10px;height:10px;border-radius:50%;border:none;background:rgba(255,255,255,.18);transition:.3s;cursor:pointer}
.testi-dots button.on{background:var(--grad);width:30px;border-radius:6px}

/* ============ CTA ============ */
.cta-box{border:1px solid transparent;border-radius:26px;background:linear-gradient(var(--panel),var(--panel)) padding-box,var(--grad) border-box;padding:60px;display:grid;grid-template-columns:1.05fr .95fr;gap:50px;align-items:center;position:relative;overflow:hidden}
.cta-box::before{content:"";position:absolute;width:340px;height:340px;border-radius:50%;background:var(--violet);filter:blur(120px);opacity:.22;right:-80px;top:-120px}

.cta-box p{color:var(--muted);margin:14px 0 28px;max-width:520px}
.cta-media{border-radius:18px;overflow:hidden;position:relative;min-height:280px;height:100%;border:1px solid var(--line)}
.cta-media img{width:100%;height:100%;object-fit:cover;animation:kenBurns 16s ease-in-out infinite alternate}
.cta-media::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(34,211,238,.18),rgba(232,237,245,.28));mix-blend-mode:overlay}
@keyframes kenBurns{from{transform:scale(1)}to{transform:scale(1.14) translate(-2%,2%)}}

/* ============ CONTACTO ============ */
.contact-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:60px;margin-top:60px;align-items:start}
.c-item{display:flex;gap:16px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}
.c-item .c-ic{width:48px;height:48px;flex:none;border-radius:12px;display:grid;place-items:center;background:rgba(34,211,238,.1);border:1px solid rgba(34,211,238,.3);color:var(--cyan)}
.c-item small{color:var(--muted);display:block;font-size:.78rem;text-transform:uppercase;letter-spacing:.12em}
.c-item a,.c-item b{font-size:1rem}
.c-item a:hover{color:var(--cyan)}
.socials{display:flex;gap:12px;margin-top:28px}
.socials a{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);transition:.3s}
.socials a:hover{background:var(--grad);color:#04060b;border-color:transparent;transform:translateY(-4px)}
.form-card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:44px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.field{margin-bottom:18px}
.field label{display:block;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.field input,.field select,.field textarea{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;color:var(--text);font-family:var(--font-b);font-size:.95rem;transition:border-color .3s,box-shadow .3s;outline:none}

.form-note{margin-top:14px;font-size:.8rem;color:var(--muted);text-align:center}

@keyframes waPulse{to{transform:scale(1.6);opacity:0}}
.to-top{position:fixed;left:24px;bottom:24px;z-index:1000;width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:rgba(14,18,27,.8);backdrop-filter:blur(10px);color:var(--cyan);display:grid;place-items:center;opacity:0;pointer-events:none;transition:.4s}

/* ============ LOGO IMAGEN FIEL (TAMAÑO REAL) ============ */
.logo-img{
  display:block;
  width:172px; height:52px;          /* navbar */

@media(max-width:1024px){

  .sp-hero{padding:140px 0 60px}

  .logo-mark{font-size:22px}
  .chart-card{padding:26px}
  .svc-flip{height:470px}
}

/* ---------- Utilidades ---------- */
function Reveal({ children, variant = "up", delay = 0, className = "" }) {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    const io = new IntersectionObserver(([e]) => { if (e.isIntersecting) { el.classList.add("in"); io.disconnect(); } }, { threshold: 0.15 });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return <div ref={ref} className={`rv rv-${variant} ${className}`} style={{ "--d": `${delay}s` }}>{children}</div>;
}

function Counter({ to, suffix = "", prefix = "" }) {
  const [val, setVal] = useState(0);
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current; let started = false;
    const io = new IntersectionObserver(([e]) => {
      if (e.isIntersecting && !started) {
        started = true;
        const t0 = performance.now(), dur = 1800;
        const tick = (t) => { const p = Math.min(1, (t - t0) / dur); setVal(Math.round(to * (1 - Math.pow(1 - p, 3)))); if (p < 1) requestAnimationFrame(tick); };
        requestAnimationFrame(tick); io.disconnect();
      }
    }, { threshold: 0.5 });
    io.observe(el); return () => io.disconnect();
  }, [to]);
  return <span ref={ref}>{prefix}{val}{suffix}</span>;
}

function useTypewriter(words) {
  const [text, setText] = useState(""); const [i, setI] = useState(0); const [del, setDel] = useState(false);
  useEffect(() => {
    const word = words[i % words.length]; let t;
    if (!del && text === word) t = setTimeout(() => setDel(true), 1700);
    else if (del && text === "") { setDel(false); setI(v => v + 1); }
    else t = setTimeout(() => setText(word.slice(0, text.length + (del ? -1 : 1))), del ? 40 : 85);
    return () => clearTimeout(t);
  }, [text, del, i]);
  return text;
}

function TiltCard({ children, className = "" }) {
  const ref = useRef(null);
  const onMove = (e) => { const el = ref.current, r = el.getBoundingClientRect(); const x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5; el.style.transform = `perspective(900px) rotateY(${x * 7}deg) rotateX(${y * -7}deg) translateY(-6px)`; };
  const onLeave = () => { ref.current.style.transform = ""; };
  return <div ref={ref} className={className} onMouseMove={onMove} onMouseLeave={onLeave}>{children}</div>;
}

function Particles() {
  const ref = useRef(null);
  useEffect(() => {
    const c = ref.current, ctx = c.getContext("2d");
    let W, H, pts = [], raf;
    const resize = () => {
      W = c.width = c.offsetWidth; H = c.height = c.offsetHeight;
      const n = Math.min(90, Math.floor(W / 14));
      pts = Array.from({ length: n }, () => ({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .45, vy: (Math.random() - .5) * .45, r: Math.random() * 1.8 + .6, col: Math.random() > .5 ? "34,211,238" : "232,237,245" }));
    };
    const draw = () => {
      ctx.clearRect(0, 0, W, H);
      pts.forEach(p => { p.x += p.vx; p.y += p.vy; if (p.x < 0 || p.x > W) p.vx *= -1; if (p.y < 0 || p.y > H) p.vy *= -1; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fillStyle = `rgba(${p.col},.7)`; ctx.fill(); });
      for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) { const a = pts[i], b = pts[j], d = Math.hypot(a.x - b.x, a.y - b.y); if (d < 120) { ctx.strokeStyle = `rgba(120,180,255,${(1 - d / 120) * .22})`; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); } }
      raf = requestAnimationFrame(draw);
    };
    resize(); draw();
    addEventListener("resize", resize);
    return () => { cancelAnimationFrame(raf); removeEventListener("resize", resize); };
  }, []);
  return <canvas ref={ref} className="hero-canvas" />;
}

  );
}

function Preloader({ done }) {
  const [pct, setPct] = useState(0);
  useEffect(() => {
    let raf; const t0 = performance.now(); const dur = 1500;
    const tick = (t) => { const p = Math.min(1, (t - t0) / dur); setPct(Math.round(p * 100)); if (p < 1) raf = requestAnimationFrame(tick); };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, []);
  return (
    <div className={`preloader ${done ? "done" : ""}`}>
      <Logo pre />
      <div className="pre-load">
        <div className="pre-bar"><i style={{ width: `${pct}%` }} /></div>
        <span className="pre-pct">{pct}%</span>
      </div>
    </div>
  );
}

function Cursor() {
  const dot = useRef(null), ring = useRef(null);
  useEffect(() => {
    if (!window.matchMedia("(pointer:fine)").matches) return;
    document.body.classList.add("has-cursor");
    let x = innerWidth / 2, y = innerHeight / 2, rx = x, ry = y, raf;
    const move = e => { x = e.clientX; y = e.clientY; dot.current.style.transform = `translate(${x}px,${y}px)`; };
    const loop = () => { rx += (x - rx) * .16; ry += (y - ry) * .16; ring.current.style.transform = `translate(${rx}px,${ry}px)`; raf = requestAnimationFrame(loop); };
    const over = e => document.body.classList.toggle("cursor-hover", !!e.target.closest("a,button,.svc-card,.proj-card"));
    addEventListener("mousemove", move); addEventListener("mouseover", over); raf = requestAnimationFrame(loop);
    return () => { removeEventListener("mousemove", move); removeEventListener("mouseover", over); cancelAnimationFrame(raf); };
  }, []);
  return <><div ref={dot} className="cursor-dot" /><div ref={ring} className="cursor-ring" /></>;
}

function Navbar({ onNav }) {
  const [scrolled, setScrolled] = useState(false);
  const [open, setOpen] = useState(false);
  const [active, setActive] = useState("inicio");
  useEffect(() => {
    const onScroll = () => {
      setScrolled(scrollY > 40);
      let cur = "inicio";
      NAV.forEach(n => { const el = document.getElementById(n.id); if (el && el.offsetTop - 160 <= scrollY) cur = n.id; });
      setActive(cur);
      document.querySelector(".to-top")?.classList.toggle("show", scrollY > 700);
      const sp = document.querySelector(".scroll-progress");
      if (sp) sp.style.width = (scrollY / (document.body.scrollHeight - innerHeight) * 100) + "%";
    };
    addEventListener("scroll", onScroll); onScroll();
    return () => removeEventListener("scroll", onScroll);
  }, []);
  useEffect(() => { document.body.style.overflow = open ? "hidden" : ""; }, [open]);
  const go = (e, id) => { e.preventDefault(); setOpen(false); onNav(id); };
  return (
    <>
      <header className={`navbar ${scrolled ? "scrolled" : ""}`}>
        <div className="container nav-inner">
          <a href="#inicio" className="logo" onClick={(e) => go(e, "inicio")}><Logo /></a>
          <ul className="nav-links">
            {NAV.map(n => <li key={n.id}><a href={`#${n.id}`} className={active === n.id ? "active" : ""} onClick={(e) => go(e, n.id)}>{n.label}</a></li>)}
          </ul>
          <a href="#contacto" className="btn btn-primary btn-sm nav-cta" onClick={(e) => go(e, "contacto")}>Cotiza tu proyecto</a>
          <button className={`burger ${open ? "open" : ""}`} onClick={() => setOpen(!open)} aria-label="Menú"><span /><span /><span /></button>
        </div>
      </header>
      <nav className={`mobile-menu ${open ? "open" : ""}`}>
        {NAV.map((n, i) => (<a key={n.id} href={`#${n.id}`} style={{ transitionDelay: `${.08 * i + .15}s` }} onClick={(e) => go(e, n.id)}>{n.label}</a>))}
      </nav>
    </>
  );
}

  useEffect(() => { const t = setInterval(() => setIdx(v => (v + 1) % TESTIMONIALS.length), 5500); return () => clearInterval(t); }, []);
  const t = TESTIMONIALS[idx];
  return (
    <section id="testimonios" className="grid-bg">
      <div className="container">
        <Reveal><span className="eyebrow">Testimonios</span>
          <h2 className="sec-title">Clientes que ya <span className="grad-text">ganan clientes</span></h2>
        </Reveal>
        <Reveal variant="zoom">
          <div className="testi-wrap">
            <div className="testi-card" key={idx}>
              <div className="testi-anim">
                <blockquote>“{t.q}”</blockquote>
                <div className="testi-author">
                  <span className="testi-avatar"><img src={t.img} alt={t.a} loading="lazy" /></span>
                  <span><b>{t.a}</b>{t.r}</span>
                </div>
              </div>
            </div>
            <div className="testi-dots">
              {TESTIMONIALS.map((_, i) => (<button key={i} className={i === idx ? "on" : ""} onClick={() => setIdx(i)} aria-label={`Testimonio ${i + 1}`} />))}
            </div>
          </div>
        </Reveal>
      </div>
    </section>
  );
}

function CTA() {
  return (
    <section style={{ paddingTop: 0 }}>
      <div className="container">
        <Reveal variant="zoom">
          <div className="cta-box">
            <div>

              <a className="btn btn-primary" href={`https://wa.me/${WHATSAPP}?text=${encodeURIComponent("Hola Ideas Digitales JC, quiero impulsar mi marca 🚀")}`} target="_blank" rel="noreferrer"><Icon name="wa" size={20} /> Hablemos por WhatsApp</a>
            </div>
            <div className="cta-media"><img src={CTA_IMG} alt="Asesoría estratégica en equipo" loading="lazy" /></div>
          </div>
        </Reveal>
      </div>
    </section>

}

function PhoneInput() {
  const [sel, setSel] = useState(COUNTRIES[0]);
  const [num, setNum] = useState("");
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    const h = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", h);
    return () => document.removeEventListener("mousedown", h);
  }, []);
  return (
    <div className="field">
      <label>Teléfono / WhatsApp</label>
      <div className="pf-wrap" ref={ref}>
        <button type="button" className={`pf-sel ${open ? "open" : ""}`} onClick={() => setOpen(o => !o)} aria-label="Seleccionar país">
          <img src={`https://flagcdn.com/w40/${sel.c}.png`} alt={sel.n} />
          <span>{sel.d}</span>
          <Icon name="chev" />
        </button>
        {open && (
          <div className="pf-drop">
            {COUNTRIES.map(k => (
              <button type="button" key={k.n} className={`pf-opt ${k.c === sel.c ? "on" : ""}`} onClick={() => { setSel(k); setOpen(false); }}>
                <img src={`https://flagcdn.com/w40/${k.c}.png`} alt={k.n} /><span className="pf-n">{k.n}</span><span className="pf-d">{k.d}</span>
              </button>
            ))}
          </div>
        )}
        <input type="tel" name="telefono" value={num} onChange={e => setNum(e.target.value)} placeholder="412-848-5721" />
      </div>
      <input type="hidden" name="telefono_completo" value={`${sel.d} ${num}`} />
      <input type="hidden" name="pais" value={sel.n} />
    </div>
  );
}

function Contact() {

    <section id="contacto">
      <div className="container">

          <h2 className="sec-title">Convierte tu idea en el <span className="grad-text">próximo caso de éxito</span></h2>
        </Reveal>
        <div className="contact-grid">
          <Reveal variant="left">
            <div className="c-item"><div className="c-ic"><Icon name="wa" size={22} /></div><div><small>WhatsApp</small><a href={`https://wa.me/${WHATSAPP}`} target="_blank" rel="noreferrer"><b>{PHONE_DISPLAY}</b></a></div></div>
            <div className="c-item"><div className="c-ic"><Icon name="mail" /></div><div><small>Email</small><a href={`mailto:${EMAIL}`}><b>{EMAIL}</b></a></div></div>
            <div className="c-item"><div className="c-ic"><Icon name="pin" /></div><div><small>Ubicación</small><b>Maracay, Venezuela · Atención Global Remota</b></div></div>
            <div className="socials">
              <a href="#" aria-label="Instagram"><Icon name="ig" /></a>
              <a href="#" aria-label="Facebook"><Icon name="fb" /></a>
              <a href="#" aria-label="TikTok"><Icon name="tk" /></a>

          </Reveal>
          <Reveal variant="right" delay={.1}>
            <form className="form-card" action={FORM_ACTION} method="POST">

              <input type="text" name="_honey" style={{ display: "none" }} tabIndex="-1" autoComplete="off" />

              <div className="form-row">
                <div className="field"><label>Nombre</label><input type="text" name="name" required placeholder="Tu nombre" /></div>
                <div className="field"><label>Email</label><input type="email" name="email" required placeholder="tucorreo@empresa.com" /></div>
              </div>
              <PhoneInput />
              <div className="field"><label>Servicio de interés</label>

              </div>
              <div className="field"><label>Cuéntanos tu idea</label><textarea name="mensaje" required placeholder="Describe tu proyecto o el resultado que buscas…" /></div>
              <button className="btn btn-primary" type="submit" style={{ width: "100%", justifyContent: "center" }}>Enviar propuesta <Icon name="arrow" /></button>
              <p className="form-note">Tu mensaje será respondido a tus datos de contacto.</p>
            </form>
          </Reveal>
        </div>
      </div>

/* ---------- App con enrutado interno ---------- */
function App() {
  const [loaded, setLoaded] = useState(false);
  const [svc, setSvc] = useState(null);
  useEffect(() => { const t = setTimeout(() => setLoaded(true), 1600); return () => clearTimeout(t); }, []);

  const navTo = (id, openSvcIdx) => {
    const scroll = () => { const el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: "smooth" }); };
    if (svc !== null) { setSvc(openSvcIdx ?? null); if (openSvcIdx == null) setTimeout(scroll, 90); else window.scrollTo(0, 0); }
    else { if (openSvcIdx != null) { setSvc(openSvcIdx); window.scrollTo(0, 0); } else scroll(); }
  };
  const openService = (i) => { setSvc(i); window.scrollTo(0, 0); };
  const backToServices = () => { setSvc(null); setTimeout(() => { const el = document.getElementById("servicios"); if (el) el.scrollIntoView({ behavior: "smooth" }); }, 90); };

  return (
    <>
      <Preloader done={loaded} />
      <Cursor />
      <div className="scroll-progress" />
      <Navbar onNav={navTo} />
      {svc === null ? (
        <main>
          <Hero />
          <Marquee items={["Diseño Web", "Apps", "Automatización IA", "RRSS", "Marketing de Contenido", "Multimedia", "Publicidad Digital"]} />
          <Services onOpen={openService} />
          <About />
          <Process />
          <Projects />
          <Testimonials />
          <Marquee items={TOOLS} tools />
          <CTA />
          <Contact />
        </main>
      ) : (
        <ServicePage idx={svc} onBack={backToServices} onNav={navTo} />
      )}
      <Footer onNav={navTo} />
      <a className="wa-float" href={`https://wa.me/${WHATSAPP}?text=${encodeURIComponent("Hola Ideas Digitales JC, necesito ayuda 🚀")}`} target="_blank" rel="noreferrer" aria-label="WhatsApp"><Icon name="wa" /></a>
      <a className="to-top" href="#inicio" aria-label="Volver arriba" onClick={(e) => { e.preventDefault(); navTo("inicio"); }}><Icon name="up" /></a>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
